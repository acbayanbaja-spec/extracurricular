version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cnhs-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=cnhs_super_secret_jwt_key_2026_production
      - JWT_REFRESH_SECRET=cnhs_refresh_jwt_key_2026_secure
      - CLIENT_URL=http://localhost:3000
    volumes:
      - backend-data:/app
    networks:
      - cnhs-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    container_name: cnhs-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - cnhs-network

volumes:
  backend-data:

networks:
  cnhs-network:
    driver: bridge
